[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-intraday-trading"
version = "0.1.0"
description = "Scaffold for a rules-based intraday trading system."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "OpenAI Codex" }
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "logzero>=1.7,<2.0",
  "pycryptodome>=3.20,<4.0",
  "smartapi-python>=1.5.5,<2.0",
  "tzdata>=2025.2",
  "uvicorn>=0.30,<1.0",
  "websocket-client>=1.8,<2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "coverage>=7.0,<8.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_intraday_trading = ["data/*.csv", "web/*.html", "web/*.css", "web/*.js"]
